name: build-pack

on:
  workflow_dispatch:
    inputs:
      region:
        description: Region a generar
        type: choice
        options: [poland, zaragoza]
        default: poland
      publish:
        description: Publicar el pack como release
        type: boolean
        default: true

permissions:
  contents: write

env:
  REGION: ${{ inputs.region }}
  PYTHONUNBUFFERED: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests

  osm:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Comprobar acceso a WorldCover y Copernicus DEM
        run: |
          BBOX=$(python -m worldpack.cli region "$REGION" bbox)
          LON=$(echo "$BBOX" | awk -F, '{print ($1+$3)/2}')
          LAT=$(echo "$BBOX" | awk -F, '{print ($2+$4)/2}')
          python -m worldpack.cli probe "$LON" "$LAT"
      - name: Descargar extracto OSM
        run: |
          URL=$(python -m worldpack.cli region "$REGION" pbf)
          curl -fL --retry 5 -o region.osm.pbf "$URL"
          ls -lh region.osm.pbf
      - name: Filtrar con osmium-tool
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
          osmium tags-filter region.osm.pbf $(python -m worldpack.cli filter-expr) \
            -o filtered.osm.pbf --overwrite
          rm region.osm.pbf
          ls -lh filtered.osm.pbf
      - name: Extraer POIs, agua, sendas y zonas protegidas
        run: python -m worldpack.cli osm --region "$REGION" --pbf filtered.osm.pbf --out osm.npz
      - uses: actions/upload-artifact@v4
        with:
          name: osm
          path: osm.npz
          retention-days: 1

  shard:
    needs: osm
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: true
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with: { name: osm }
      - name: Rasterizar y codificar shard ${{ matrix.shard }}
        run: |
          python -m worldpack.cli shard --region "$REGION" --osm osm.npz \
            --shard ${{ matrix.shard }} --shards 4 --out part-${{ matrix.shard }}.bin
      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.shard }}
          path: |
            part-${{ matrix.shard }}.bin
            part-${{ matrix.shard }}.bin.json
          retention-days: 1

  assemble:
    needs: shard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with: { pattern: part-*, merge-multiple: true }
      - uses: actions/download-artifact@v4
        with: { name: osm }
      - name: Ensamblar
        run: |
          CV=$(date -u +%Y%m%d)
          echo "CV=$CV" >> "$GITHUB_ENV"
          python -m worldpack.cli assemble --region "$REGION" --osm osm.npz \
            --content-version "$CV" --out "$REGION.pack" --report build_report.json part-*.bin
          ls -lh "$REGION.pack"
      - name: Comprobacion rapida
        if: env.REGION == 'poland'
        run: |
          for p in "21.0122 52.2297 Varsovia" "20.0883 49.1794 Rysy" \
                   "19.9450 50.0647 Cracovia" "18.6466 54.3520 Gdansk"; do
            set -- $p; echo "$3: $(python -m worldpack.cli query "$REGION.pack" $1 $2)"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.REGION }}-pack
          path: |
            ${{ env.REGION }}.pack
            build_report.json
          retention-days: 7
      - name: Publicar release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="pack-$REGION-$CV-${{ github.run_number }}"
          gh release create "$TAG" "$REGION.pack" build_report.json \
            --title "Worldpack $REGION $CV" \
            --notes "Worldpack v1 ($REGION), content_version $CV.

          Fuentes: ESA WorldCover 2021 v200 (CC BY 4.0), Copernicus DEM GLO-30,
          datos © colaboradores de OpenStreetMap (ODbL)."
